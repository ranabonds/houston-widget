<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Houston Air Quality & Pollen</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sky: #1a6fa8;
    --green: #2d7a4f;
    --amber: #b85c00;
    --red: #b03030;
    --purple: #6b3fa0;
    --text: #1a1a2e;
    --text-muted: #8888aa;
    --border: #e0e0f0;
    --bg: #f7f8fc;
    --card: #ffffff;
    --radius: 14px;
    --radius-sm: 8px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0;
  }
  .widget { width: 100%; max-width: 480px; padding: 20px 16px 24px; }
  .widget-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  .widget-title { font-size: 13px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .widget-location { font-size: 19px; font-weight: 500; color: var(--text); margin-top: 2px; }
  .refresh-btn {
    background: none; border: 1px solid var(--border); border-radius: 20px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; color: var(--text-muted);
    padding: 5px 12px; cursor: pointer; display: flex; align-items: center;
    gap: 5px; transition: border-color 0.2s, color 0.2s; white-space: nowrap;
  }
  .refresh-btn:hover { border-color: var(--sky); color: var(--sky); }
  .refresh-btn.spinning .spin-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin-icon { display: inline-block; }
  .section-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin: 0 0 8px 2px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; }
  .pollen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .metric { background: var(--bg); border-radius: var(--radius-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .metric-value { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); line-height: 1.1; transition: color 0.3s; }
  .metric-cat { font-size: 12px; color: var(--text-muted); margin-top: 1px; display: flex; align-items: center; gap: 4px; }
  .level-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .aqi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .aqi-big { background: var(--bg); border-radius: var(--radius-sm); padding: 14px; display: flex; flex-direction: column; justify-content: center; }
  .aqi-number { font-family: 'DM Mono', monospace; font-size: 36px; font-weight: 500; line-height: 1; transition: color 0.3s; }
  .aqi-bar-wrap { margin-top: 8px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .aqi-bar { height: 100%; border-radius: 2px; transition: width 0.8s ease, background 0.3s; width: 0%; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 0 2px; flex-wrap: wrap; gap: 6px; }
  .footer-links { display: flex; gap: 14px; }
  .footer-links a { font-size: 11px; color: var(--text-muted); text-decoration: none; }
  .footer-links a:hover { color: var(--sky); text-decoration: underline; }
  .updated-time { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }
  .error-msg { font-size: 12px; color: var(--red); background: #fdeaea; border-radius: var(--radius-sm); padding: 8px 12px; margin-top: 8px; display: none; line-height: 1.5; }
  .loading-pulse { display: inline-block; width: 48px; height: 16px; background: linear-gradient(90deg, var(--border) 25%, var(--bg) 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 4px; vertical-align: middle; }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="widget">
  <div class="widget-header">
    <div>
      <div class="widget-title">Daily Conditions</div>
      <div class="widget-location">Houston, TX</div>
    </div>
    <button class="refresh-btn" onclick="fetchAll()" id="refresh-btn">
      <span class="spin-icon">↻</span> Refresh
    </button>
  </div>

  <div class="section-label">Pollen &amp; Mold — Houston Health Dept</div>
  <div class="card">
    <div class="pollen-grid">
      <div class="metric">
        <div class="metric-label">Tree Pollen</div>
        <div class="metric-value" id="val-tree"><span class="loading-pulse"></span></div>
        <div class="metric-cat" id="cat-tree">Loading…</div>
      </div>
      <div class="metric">
        <div class="metric-label">Grass Pollen</div>
        <div class="metric-value" id="val-grass"><span class="loading-pulse"></span></div>
        <div class="metric-cat" id="cat-grass">Loading…</div>
      </div>
      <div class="metric">
        <div class="metric-label">Weed Pollen</div>
        <div class="metric-value" id="val-weed"><span class="loading-pulse"></span></div>
        <div class="metric-cat" id="cat-weed">Loading…</div>
      </div>
      <div class="metric">
        <div class="metric-label">Mold Spores</div>
        <div class="metric-value" id="val-mold"><span class="loading-pulse"></span></div>
        <div class="metric-cat" id="cat-mold">Loading…</div>
      </div>
    </div>
    <div class="error-msg" id="pollen-error"></div>
  </div>

  <div class="section-label" style="margin-top:14px">Air Quality Index — EPA AirNow</div>
  <div class="card">
    <div class="aqi-row">
      <div class="aqi-big">
        <div class="metric-label">AQI</div>
        <div class="aqi-number" id="val-aqi"><span class="loading-pulse"></span></div>
        <div class="aqi-bar-wrap"><div class="aqi-bar" id="aqi-bar"></div></div>
        <div class="metric-cat" id="cat-aqi" style="margin-top:6px">Loading…</div>
      </div>
      <div class="aqi-big">
        <div class="metric-label">Primary Pollutant</div>
        <div class="metric-value" id="val-pollutant" style="font-size:18px;margin-top:4px"><span class="loading-pulse"></span></div>
        <div class="metric-cat" id="cat-pollutant" style="margin-top:4px">—</div>
      </div>
    </div>
    <div class="error-msg" id="aqi-error"></div>
  </div>

  <div class="footer">
    <div class="footer-links">
      <a href="https://www.houstontx.gov/health/Pollen/" target="_blank">HHD Pollen ↗</a>
      <a href="https://www.airnow.gov/?city=Houston&state=TX" target="_blank">EPA AirNow ↗</a>
    </div>
    <div class="updated-time" id="updated-time">—</div>
  </div>
</div>

<script>
  function pollenLevel(type, val) {
    if (val === null || val === undefined || isNaN(val)) return { cat: "No data", color: "#8888aa", dot: "#ccccdd" };
    const n = Number(val);
    if (type === "mold") {
      if (n < 6500)  return { cat: "Low",      color: "#2d7a4f", dot: "#2d7a4f" };
      if (n < 13000) return { cat: "Moderate", color: "#b85c00", dot: "#b85c00" };
      if (n < 50000) return { cat: "High",     color: "#b03030", dot: "#b03030" };
      return           { cat: "Very High", color: "#6b3fa0", dot: "#6b3fa0" };
    }
    if (n < 15)   return { cat: "Low",      color: "#2d7a4f", dot: "#2d7a4f" };
    if (n < 90)   return { cat: "Moderate", color: "#b85c00", dot: "#b85c00" };
    if (n < 1500) return { cat: "High",     color: "#b03030", dot: "#b03030" };
    return          { cat: "Very High", color: "#6b3fa0", dot: "#6b3fa0" };
  }

  function aqiMeta(aqi) {
    if (aqi <= 50)  return { cat: "Good",                           color: "#2d7a4f", pct: Math.round(aqi/50*17) };
    if (aqi <= 100) return { cat: "Moderate",                       color: "#b85c00", pct: Math.round(17+(aqi-50)/50*17) };
    if (aqi <= 150) return { cat: "Unhealthy for Sensitive Groups", color: "#c47a00", pct: Math.round(34+(aqi-100)/50*17) };
    if (aqi <= 200) return { cat: "Unhealthy",                      color: "#b03030", pct: Math.round(51+(aqi-150)/50*17) };
    if (aqi <= 300) return { cat: "Very Unhealthy",                 color: "#6b3fa0", pct: Math.round(68+(aqi-200)/100*17) };
    return                  { cat: "Hazardous",                      color: "#7a1a1a", pct: 100 };
  }

  function setEl(id, text)         { const e = document.getElementById(id); if (e) e.textContent = text; }
  function setStyle(id, prop, val) { const e = document.getElementById(id); if (e) e.style[prop] = val; }
  function showErr(id, msg)        { const e = document.getElementById(id); if (e) { e.innerHTML = msg; e.style.display = "block"; } }
  function hideErr(id)             { const e = document.getElementById(id); if (e) e.style.display = "none"; }
  function setSpinner(on)          { const b = document.getElementById("refresh-btn"); if (b) b.classList.toggle("spinning", on); }

  async function fetchPollen() {
    hideErr("pollen-error");
    try {
      const resp = await fetch("/.netlify/functions/pollen");
      if (!resp.ok) throw new Error("Server error " + resp.status);
      const d = await resp.json();
      if (d.error) throw new Error(d.error);
      ["tree","grass","weed","mold"].forEach(t => {
        const v = d[t];
        const display = (v !== null && v !== undefined && !isNaN(v)) ? Number(v).toLocaleString() : "N/A";
        setEl("val-" + t, display);
        const lvl = pollenLevel(t, v);
        const catEl = document.getElementById("cat-" + t);
        if (catEl) catEl.innerHTML = `<span class="level-dot" style="background:${lvl.dot}"></span>${lvl.cat}`;
        setStyle("val-" + t, "color", lvl.color);
      });
    } catch(e) {
      showErr("pollen-error", "Pollen data could not be loaded. Visit <a href='https://www.houstontx.gov/health/Pollen/' target='_blank' style='color:inherit'>houstontx.gov/health/Pollen</a> directly.");
      ["tree","grass","weed","mold"].forEach(t => { setEl("val-"+t, "N/A"); setEl("cat-"+t, "—"); });
    }
  }

  async function fetchAQI() {
    hideErr("aqi-error");
    try {
      const resp = await fetch("/.netlify/functions/aqi");
      if (!resp.ok) throw new Error("Server error " + resp.status);
      const d = await resp.json();
      if (d.error) throw new Error(d.error);
      const meta = aqiMeta(d.aqi);
      setEl("val-aqi", d.aqi);
      setStyle("val-aqi", "color", meta.color);
      setEl("cat-aqi", meta.cat);
      setStyle("aqi-bar", "width", meta.pct + "%");
      setStyle("aqi-bar", "background", meta.color);
      setEl("val-pollutant", d.pollutant || "—");
      setEl("cat-pollutant", d.category || "—");
    } catch(e) {
      showErr("aqi-error", "AQI data could not be loaded. Visit <a href='https://www.airnow.gov/?city=Houston&state=TX' target='_blank' style='color:inherit'>airnow.gov</a> directly.");
      setEl("val-aqi", "N/A"); setEl("cat-aqi", "—");
      setEl("val-pollutant", "N/A"); setEl("cat-pollutant", "—");
    }
  }

  function updateTimestamp() {
    const opts = { timeZone: "America/Chicago", month: "short", day: "numeric", hour: "numeric", minute: "2-digit", hour12: true };
    setEl("updated-time", new Date().toLocaleString("en-US", opts) + " CT");
  }

  async function fetchAll() {
    setSpinner(true);
    updateTimestamp();
    await Promise.all([fetchPollen(), fetchAQI()]);
    setSpinner(false);
  }

  function scheduleDailyAt1030() {
    const now = new Date();
    const central = new Date(now.toLocaleString("en-US", { timeZone: "America/Chicago" }));
    const next = new Date(central);
    next.setHours(10, 30, 0, 0);
    if (next <= central) next.setDate(next.getDate() + 1);
    setTimeout(() => { fetchAll(); setInterval(fetchAll, 24*60*60*1000); }, next - central);
  }

  fetchAll();
  scheduleDailyAt1030();
</script>
</body>
</html>
